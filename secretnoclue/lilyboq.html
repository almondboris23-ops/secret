<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Secret Door</title>
<style>
:root{--bg1:#2a1238;--bg2:#0a0612;--btn:rgba(255,255,255,.1);--fg:#fff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1238}}
:root[data-theme="dark"]{--bg1:#2a1238}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;background:radial-gradient(ellipse at 50% 38%,var(--bg1),var(--bg2) 75%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:12px;justify-content:center}
button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:var(--btn);color:var(--fg);font-size:20px;cursor:pointer;backdrop-filter:blur(8px)}
.card{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);width:min(92vw,400px);box-sizing:border-box;padding:16px 18px 14px;border-radius:18px;background:rgba(22,10,34,.8);border:1px solid rgba(255,217,138,.35);color:#f6eefc;font-family:Georgia,'Times New Roman',serif;backdrop-filter:blur(10px);text-align:center}
.card[hidden]{display:none}
.card .ey{margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#ffd98a}
.card .rd{margin:0 0 12px;font-size:17px;line-height:1.5;font-style:italic}
.card .in{display:flex;gap:8px}
.card input{flex:1;min-width:0;font:16px Georgia,serif;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;outline:none}
.card input:focus{border-color:#ffd98a}
.card button{width:auto;height:auto;border-radius:12px;padding:10px 16px;font:15px Georgia,serif;background:#ffd98a;color:#2a1238;border:0}
.card .x{position:absolute;top:6px;right:8px;width:28px;height:28px;padding:0;background:none;color:#fff;font-size:20px;opacity:.7}
.card .msg{min-height:18px;margin:8px 0 0;font-size:13px;color:#ffb3d4}
.card.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(calc(-50% - 8px))}40%{transform:translateX(calc(-50% + 8px))}60%{transform:translateX(calc(-50% - 5px))}80%{transform:translateX(calc(-50% + 5px))}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="riddle" class="card" hidden>
<button class="x" id="rx" aria-label="Close">×</button>
<p class="ey">The door is locked · answer to enter</p>
<p class="rd">I ring no sound though I carry bells,<br>White little lanterns in shady dells.<br>Two broad leaves wrap my slender stem,<br>And May wears me like a gem.<br>What flower am I?</p>
<div class="in"><input id="ans" placeholder="Your answer…" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="go">Open</button></div>
<p class="msg" id="msg"></p>
</div>
<div class="bar"><button id="replay" aria-label="Replay">↻</button><button id="fresh" aria-label="New bouquet">✿</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const cv=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,1,.1,100);
scene.add(new THREE.HemisphereLight(0xe4e8ff,0x3a1848,.95));
const key=new THREE.DirectionalLight(0xfff0e0,1.35);key.position.set(4,9,6);scene.add(key);
const rim=new THREE.PointLight(0xff7fb8,1.6,30);rim.position.set(-6,3,-5);scene.add(rim);
const rim2=new THREE.PointLight(0x9fb4ff,1.0,30);rim2.position.set(6,2,-4);scene.add(rim2);

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=t=>{t=clamp(t);const c=1.70158,d=c+1;return 1+d*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const smooth=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
function RNG(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const stemMat=new THREE.MeshStandardMaterial({color:0x7cc78a,roughness:.55});
const bellMat=new THREE.MeshPhysicalMaterial({color:0xefe3d8,roughness:.4,clearcoat:.3,clearcoatRoughness:.4,emissive:0x140c18,side:THREE.DoubleSide});
const budMat=new THREE.MeshStandardMaterial({color:0xcfe0c2,roughness:.55});
const leafMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.45,side:THREE.DoubleSide});
const paperMat=new THREE.MeshStandardMaterial({color:0xe6d6cc,roughness:.85,side:THREE.DoubleSide});
const ribbonMat=new THREE.MeshStandardMaterial({color:0xff9ec4,roughness:.25,metalness:.1});

function bellGeo(){
  const pts=[[.001,.02],[.05,.015],[.12,-.02],[.19,-.1],[.22,-.2],[.2,-.29],[.17,-.34],[.2,-.37],[.25,-.4]].map(p=>new THREE.Vector2(p[0],p[1]));
  const g=new THREE.LatheGeometry(pts,30),pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
    if(y<-.33){const a=Math.atan2(z,x),m=Math.min(1,(-.33-y)/.07),c=Math.cos(6*a);pos.setXYZ(i,x*(1+.1*c*m),y+c*.025*m,z*(1+.1*c*m));}}
  g.computeVertexNormals();return g;
}
const BELL=bellGeo(),BUD=new THREE.SphereGeometry(.07,12,10),PED=new THREE.CylinderGeometry(.008,.008,.15,5);

function makeStem(rr,nk){
  const g=new THREE.Group(),l=(1.1+rr()*1.1)*nk,h=3.5+rr()*1.8;
  const curve=new THREE.CatmullRomCurve3([[0,0],[.1*l,.4*h],[.3*l,.78*h],[.7*l,h],[1.15*l,.93*h],[1.5*l,.7*h]].map(p=>new THREE.Vector3(p[0],p[1],0)));
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,56,.022,6),stemMat));
  const nb=7+Math.floor(rr()*3),pivots=[];
  for(let j=0;j<nb;j++){
    const u=.6+.39*j/(nb-1),p=curve.getPoint(u),pv=new THREE.Group(),side=j%2?1:-1;
    pv.position.copy(p);pv.rotation.x=side*(.55+rr()*.3);
    const inner=new THREE.Group();pv.add(inner);
    const ped=new THREE.Mesh(PED,stemMat);ped.position.y=-.075;inner.add(ped);
    if(j>=nb-2){const b=new THREE.Mesh(BUD,budMat);b.position.y=-.2;b.scale.set(1,1.3,1);b.scale.multiplyScalar(j===nb-1?.7:1);inner.add(b);}
    else{const bl=new THREE.Mesh(BELL,bellMat),s=.85-.4*(j/(nb-1));bl.scale.setScalar(s);bl.position.y=-.14;bl.rotation.y=rr()*6;inner.add(bl);}
    g.add(pv);pivots.push({pv,inner,ph:rr()*6.28});
  }
  g.userData={pivots,ph:rr()*6.28};
  return g;
}
function makeLeaf(rr){
  const Ln=3+rr()*1.8,Wm=.55+rr()*.25,bend=.9+rr()*.6,out=.6+rr()*.7;
  const g=new THREE.PlaneGeometry(1,1,14,28),pos=g.attributes.position,col=[];
  for(let i=0;i<pos.count;i++){
    const a=pos.getX(i)*2,v=pos.getY(i)+.5,w=Wm*Math.pow(Math.max(0,Math.sin(Math.PI*Math.pow(v,.7))),.9);
    const x=Ln*out*v*v,y=Ln*(v-.45*bend*v*v*v)+Math.abs(a)*w*.35+Math.sin(v*9+a*2)*.02*w,z=a*w;
    pos.setXYZ(i,x,y,z);
    const k=.35*v+.25*Math.abs(a);col.push(.1+.2*k,.32+.4*k,.18+.2*k);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.computeVertexNormals();
  return new THREE.Mesh(g,leafMat);
}
function makeWrap(){
  const g=new THREE.Group(),cg=new THREE.CylinderGeometry(1.5,.3,2.8,48,12,true),p=cg.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),a=Math.atan2(z,x),k=1+.07*Math.sin(7*a+y*1.5)*smooth(-1.4,1.4,y);p.setXYZ(i,x*k,y,z*k);}
  cg.computeVertexNormals();const cone=new THREE.Mesh(cg,paperMat);cone.position.y=-1.1;g.add(cone);
  const band=new THREE.Mesh(new THREE.TorusGeometry(.68,.06,14,60),ribbonMat);band.rotation.x=Math.PI/2;band.position.y=-1.15;g.add(band);
  for(const s of[-1,1]){const lp=new THREE.Mesh(new THREE.TorusGeometry(.32,.055,12,36),ribbonMat);lp.scale.set(1.2,.8,1);lp.position.set(s*.36,-1.15,.68);lp.rotation.set(.2,s*.5,s*.5);g.add(lp);
    const tl=new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,.7,8),ribbonMat);tl.position.set(s*.18,-1.55,.7);tl.rotation.z=s*.25;g.add(tl);}
  const kn=new THREE.Mesh(new THREE.SphereGeometry(.12,16,12),ribbonMat);kn.position.set(0,-1.15,.7);g.add(kn);
  return g;
}
const ZOFF=-10;let narrow=1,fitS=1;let bouquet,seed=21,T0=1e9,T=0;
function build(sd){
  if(bouquet)scene.remove(bouquet);
  const rr=RNG(sd),root=new THREE.Group(),stems=[],leaves=[];
  for(let i=0;i<16;i++){const s=makeStem(rr,narrow),ang=rr()*6.283,rad=Math.sqrt(rr())*.28;
    s.position.set(Math.cos(ang)*rad,-.5,Math.sin(ang)*rad);s.rotation.y=ang;s.rotation.z=-(.12+rr()*.38)*narrow;
    s.userData.base={rz:s.rotation.z,d:.4+i*.17+rr()*.3};root.add(s);stems.push(s);}
  for(let i=0;i<7;i++){const L=makeLeaf(rr),ang=i/7*6.283+rr()*.5;L.position.set(Math.cos(ang)*.15,-.4,Math.sin(ang)*.15);L.rotation.y=-ang;L.userData={d:.1+i*.12,ph:rr()*6.28};root.add(L);leaves.push(L);}
  root.add(makeWrap());root.userData={stems,leaves};root.position.set(0,-.4,ZOFF);
  scene.add(root);bouquet=root;
}
// hearts + sparkles
function heartTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle='#fff';x.shadowColor='#fff';x.shadowBlur=10;x.beginPath();x.moveTo(64,106);x.bezierCurveTo(8,68,18,18,64,42);x.bezierCurveTo(110,18,120,68,64,106);x.fill();return new THREE.CanvasTexture(c);}
function dotTex(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.3,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
const HT=heartTex(),hcols=[0xff5fa2,0xff3b4e,0xffb3d4,0xffffff],hearts=[];
const hr=RNG(5);
for(let i=0;i<34;i++){const m=new THREE.SpriteMaterial({map:HT,color:hcols[i%4],transparent:true,depthWrite:false,opacity:0});const s=new THREE.Sprite(m);scene.add(s);
  hearts.push({s,m,x:(hr()*2-1)*3.2,z:(hr()*2-1)*2,y:hr()*7,v:.5+hr()*.7,ph:hr()*6.28,sz:.25+hr()*.4});}
const SP=700,spg=new THREE.BufferGeometry(),spp=new Float32Array(SP*3),spb=[];
for(let i=0;i<SP;i++){spp[i*3]=(hr()*2-1)*6;spp[i*3+1]=hr()*9-2;spp[i*3+2]=(hr()*2-1)*4;spb.push(hr()*6.28);}
spg.setAttribute('position',new THREE.BufferAttribute(spp,3));
const sparks=new THREE.Points(spg,new THREE.PointsMaterial({map:dotTex(),size:.1,transparent:true,opacity:.7,depthWrite:false,blending:THREE.AdditiveBlending,color:0xffd6ea}));scene.add(sparks);
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:dotTex(),color:0xff7fb8,transparent:true,opacity:.22,depthWrite:false,blending:THREE.AdditiveBlending}));glow.scale.set(14,14,1);glow.position.set(0,2,-3);scene.add(glow);

scene.fog=new THREE.Fog(0x0a0612,24,70);
key.position.set(4,9,6);rim.position.z+=ZOFF;rim2.position.z+=ZOFF;sparks.position.z=ZOFF;glow.position.z=-3+ZOFF;
const front=new THREE.PointLight(0xffd9a8,1.3,30);front.position.set(-4,4,8);scene.add(front);
const inLight=new THREE.PointLight(0xfff0d0,0,30);inLight.position.set(0,2,ZOFF+4);scene.add(inLight);
const lerp=(a,b,k)=>a+(b-a)*k;
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
// ---- door world ----
const DW=4.4,DH=7.4,HW=DW/2+.06,AY=DH-3-DW/2;
const woodTex=canvasTex(512,1024,(x,w,h)=>{const cols=['#b9824b','#a8703d','#c28a52','#9f6a39','#b27a45'],n=5,pw=w/n;
  for(let i=0;i<n;i++){x.fillStyle=cols[i];x.fillRect(i*pw,0,pw,h);
    for(let k=0;k<26;k++){x.strokeStyle='rgba(70,35,15,'+(.12+Math.random()*.2)+')';x.lineWidth=1+Math.random()*2;x.beginPath();const gx=i*pw+Math.random()*pw;x.moveTo(gx,0);for(let y=0;y<=h;y+=64)x.lineTo(gx+Math.sin(y*.02+k)*4,y);x.stroke();}
    x.fillStyle='rgba(60,28,10,.35)';x.beginPath();x.ellipse(i*pw+pw*(.3+Math.random()*.4),h*(.15+Math.random()*.7),9,16,0,0,6.3);x.fill();
    x.fillStyle='#2a140a';x.fillRect(i*pw-2,0,5,h);}},[1/DW,1/DH]);
const brickTex=canvasTex(512,512,(x,w,h)=>{x.fillStyle='#2b1a36';x.fillRect(0,0,w,h);const bh=h/8,bw=w/4;
  for(let r=0;r<8;r++)for(let c=-1;c<5;c++){const o=r%2?bw/2:0;x.fillStyle='hsl('+(300+Math.random()*25)+','+(25+Math.random()*10)+'%,'+(32+Math.random()*10)+'%)';x.fillRect(c*bw+o+3,r*bh+3,bw-6,bh-6);}},[1/3.5,1/3.5]);
const ironMat=new THREE.MeshStandardMaterial({color:0x2a2230,roughness:.4,metalness:.7});
const doorMat=new THREE.MeshStandardMaterial({map:woodTex,roughness:.8});
function arch(P,hw,y0,ay){P.moveTo(-hw,y0);P.lineTo(hw,y0);P.lineTo(hw,ay);P.absarc(0,ay,hw,0,Math.PI,false);P.lineTo(-hw,y0);return P;}
const wall=new THREE.Shape();wall.moveTo(-16,-3.5);wall.lineTo(16,-3.5);wall.lineTo(16,14);wall.lineTo(-16,14);wall.lineTo(-16,-3.5);wall.holes.push(arch(new THREE.Path(),HW,-3,AY));
const wallM=new THREE.Mesh(new THREE.ExtrudeGeometry(wall,{depth:.6,bevelEnabled:false}),new THREE.MeshStandardMaterial({map:brickTex,roughness:.9}));wallM.position.z=-.3;scene.add(wallM);
const fr=arch(new THREE.Shape(),HW+.55,-3.5,AY);fr.holes.push(arch(new THREE.Path(),HW,-3,AY));
const frameM=new THREE.Mesh(new THREE.ExtrudeGeometry(fr,{depth:.65,bevelEnabled:true,bevelSize:.06,bevelThickness:.06,bevelSegments:2}),new THREE.MeshStandardMaterial({color:0xd9c8e0,roughness:.7}));frameM.position.z=-.1;scene.add(frameM);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x2a1836,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.set(0,-3,-30);scene.add(floor);
function leaf2(sd){
  const P=new THREE.Group();P.position.set(sd*DW/2,-3,.1);scene.add(P);
  const w=DW/2,c=DH-w,sh=new THREE.Shape();
  sh.moveTo(0,0);sh.lineTo(-sd*w,0);sh.lineTo(-sd*w,DH);sh.absarc(-sd*w,c,w,Math.PI/2,sd<0?Math.PI:0,sd>0);sh.lineTo(0,0);
  const m=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.22,bevelEnabled:true,bevelSize:.03,bevelThickness:.03,bevelSegments:2}),doorMat);m.position.z=-.11;P.add(m);
  for(const y of[1.3,4.3]){const st=new THREE.Mesh(new THREE.BoxGeometry(w-.2,.28,.05),ironMat);st.position.set(-sd*w/2,y,.17);P.add(st);
    for(let i=0;i<4;i++){const b=new THREE.Mesh(new THREE.SphereGeometry(.06,10,8),ironMat);b.position.set(-sd*(.4+i*.5),y,.21);P.add(b);}
    const h=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.5,12),ironMat);h.position.set(-sd*.02,y,.1);P.add(h);}
  const kx=-sd*(w-.35);
  const pl=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.05,24),ironMat);pl.rotation.x=Math.PI/2;pl.position.set(kx,3.2,.18);P.add(pl);
  const rg=new THREE.Mesh(new THREE.TorusGeometry(.19,.04,12,32),ironMat);rg.position.set(kx,3.0,.26);P.add(rg);
  const kb=new THREE.Mesh(new THREE.SphereGeometry(.1,16,12),new THREE.MeshStandardMaterial({color:0xffc86b,metalness:.8,roughness:.25}));kb.position.set(kx,3.2,.24);P.add(kb);
  return P;}
const doorL=leaf2(-1),doorR=leaf2(1),doors=[doorL,doorR];
const hint=new THREE.Sprite(new THREE.SpriteMaterial({map:dotTex(),color:0xffe7a8,transparent:true,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending}));hint.position.set(0,.2,.5);hint.renderOrder=10;scene.add(hint);
const flash=new THREE.Sprite(new THREE.SpriteMaterial({map:dotTex(),color:0xfff0c8,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));flash.scale.set(11,13,1);flash.position.set(0,1,-.8);scene.add(flash);
// ---- butterflies ----
const WG=(()=>{const s=new THREE.Shape();s.moveTo(0,.42);s.bezierCurveTo(.1,.9,.55,1.1,1,.9);s.bezierCurveTo(1.05,.65,.7,.5,.45,.42);s.bezierCurveTo(.85,.35,.8,.02,.5,.04);s.bezierCurveTo(.25,.06,.08,.25,0,.42);const g=new THREE.ShapeGeometry(s,16);g.rotateX(Math.PI/2);return g;})();
function wingTex(a,b){return canvasTex(256,256,(x,w,h)=>{const g=x.createRadialGradient(0,h*.55,4,w*.45,h*.45,w);g.addColorStop(0,a);g.addColorStop(.65,b);g.addColorStop(1,'#2a1233');x.fillStyle=g;x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(30,10,40,.35)';x.lineWidth=2;for(let i=0;i<7;i++){x.beginPath();x.moveTo(0,h*.58);x.lineTo(w,h*(.08+i*.14));x.stroke();}
  x.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<5;i++){x.beginPath();x.arc(w*(.6+.08*i),h*(.9-.06*i),5,0,6.3);x.fill();x.beginPath();x.arc(w*(.55+.09*i),h*(.08+.05*i),4,0,6.3);x.fill();}});}
const PAL=[['#ffd1e6','#ff5fa2'],['#ffffff','#c9b6ff'],['#ffe9a8','#ff9a3c'],['#bfe3ff','#4a8bff']],bodyMat=new THREE.MeshStandardMaterial({color:0x2a1530,roughness:.6}),bodyG=new THREE.SphereGeometry(.05,10,8),fr2=RNG(99),flies=[];
for(let i=0;i<14;i++){const p=PAL[i%4],mat=new THREE.MeshStandardMaterial({map:wingTex(p[0],p[1]),side:THREE.DoubleSide,roughness:.6,emissive:0x2a1038,emissiveIntensity:.5}),g=new THREE.Group(),sc=.55+fr2()*.35;
  const R=new THREE.Mesh(WG,mat),L=new THREE.Mesh(WG,mat);L.scale.x=-1;const body=new THREE.Mesh(bodyG,bodyMat);body.scale.set(.8,.8,5);body.position.z=.2*sc;
  const wings=new THREE.Group();wings.scale.setScalar(sc);wings.add(R,L);g.add(wings,body);
  g.userData={R,L,x0:(fr2()*2-1)*3,y0:-.5+fr2()*3.2,a:.5+fr2()*.5,b:.7+fr2()*.6,c:.4+fr2()*.5,p1:fr2()*6.28,p2:fr2()*6.28,p3:fr2()*6.28,sp:11+fr2()*6,sc};
  scene.add(g);flies.push(g);}
const tmp=new THREE.Vector3();
function fly(u,tt,k1,k2,out){
  const cx=lerp(lerp(u.x0,0,k1),0,k2),cy=lerp(lerp(u.y0,1.2,k1),2.2,k2),cz=lerp(lerp(1.8,1.4,k1),ZOFF+.5,k2);
  const rx=lerp(lerp(1.6,.8,k1),4.2,k2),ry=lerp(lerp(1.1,.8,k1),2.8,k2),rz=lerp(lerp(.7,.5,k1),3.2,k2);
  out.set(cx+rx*Math.sin(u.a*tt+u.p1),cy+ry*Math.sin(u.b*tt+u.p2)+.25*Math.sin(7*tt+u.p3),cz+rz*Math.sin(u.c*tt+u.p3));return out;}
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function hitDoor(e){const r=cv.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,camera);return ray.intersectObjects(doors,true).length>0;}
let shake=0,tries=0;
const card=document.getElementById('riddle'),ans=document.getElementById('ans'),msg=document.getElementById('msg');
function openDoor(){opened=true;openStart=T;T0=T+2.3;}
function showRiddle(){card.hidden=false;msg.textContent='';ans.value='';setTimeout(()=>ans.focus(),50);}
function good(v){v=v.toLowerCase().replace(/[^a-z]/g,'');return v==='lily'||v==='muguet'||v==='liliesofthevalley'||(v.startsWith('lily')&&v.includes('valley'));}
function submit(){if(good(ans.value)){msg.style.color='#bff5c8';msg.textContent='Yes! The door remembers you ✿';ans.blur();setTimeout(()=>{card.hidden=true;openDoor();},650);}
  else{tries++;shake=1;card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');msg.style.color='#ffb3d4';msg.textContent=tries>=2?'Hint: its name has a lily and a valley in it.':'Not quite… think of May, shade and tiny bells.';}}
document.getElementById('go').onclick=submit;ans.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
document.getElementById('rx').onclick=()=>{card.hidden=true;};
function updateDoor(dt){shake=Math.max(0,shake-dt*2.5);
  const ot=opened?T-openStart:0,kk=smooth(1,4.6,ot),k1=smooth(.5,2,ot),k2=smooth(2,4.8,ot);
  {const a=opened?2*ease((ot-.15)/1.7):shake*Math.sin(T*50)*.03;doorL.rotation.y=-a;doorR.rotation.y=a;}
  hint.visible=!opened;hint.material.opacity=.35+.3*Math.sin(T*3);hint.scale.setScalar(.8+.15*Math.sin(T*3));
  flash.material.opacity=opened?.5*smooth(.1,1,ot)*(1-smooth(2,3.4,ot)):0;
  inLight.intensity=opened?1.1*smooth(0,1.6,ot):0;
  for(const b of flies){const u=b.userData;fly(u,T,k1,k2,b.position);fly(u,T+.05,k1,k2,tmp);b.lookAt(tmp);
    const f=Math.sin(T*u.sp+u.p1)*.8+.35;u.R.rotation.z=f;u.L.rotation.z=-f;}
  bouquet.scale.setScalar(fitS);const d=dist,cy=-.4+1.35*fitS,pa=[0,cy+.6+Math.sin(pitch)*d*.6,ZOFF+Math.cos(pitch)*d],pb=[0,1.2+Math.sin(T*.4)*.15,15];
  camera.position.set(lerp(pb[0],pa[0],kk),lerp(pb[1],pa[1],kk),lerp(pb[2],pa[2],kk));camera.lookAt(0,lerp(.9,cy,kk),lerp(0,ZOFF,kk));
}
// ---- controls ----
let yaw=0,pitch=.12,dist=9,tYaw=0,tPitch=.12,drag=false,lx=0,ly=0,sx=0,sy=0,idle=0,opened=false,openStart=0;
const ptrs=new Map();let pd0=0;
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);drag=true;sx=lx=e.clientX;sy=ly=e.clientY;cv.setPointerCapture(e.pointerId);if(opened)cv.style.cursor='grabbing'});
const up=e=>{ptrs.delete(e.pointerId);pd0=0;drag=ptrs.size>0;};
cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerup',e=>{up(e);if(!opened&&Math.hypot(e.clientX-sx,e.clientY-sy)<10&&hitDoor(e)){showRiddle();}cv.style.cursor=opened?'grab':'default'});
cv.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(!drag){if(!opened)cv.style.cursor=hitDoor(e)?'pointer':'default';return;}if(!opened)return;
  if(ptrs.size>=2){const [p,q]=[...ptrs.values()],d=Math.hypot(p[0]-q[0],p[1]-q[1]);if(pd0)dist=clamp(dist-(d-pd0)*.02,5,9.2);pd0=d;lx=e.clientX;ly=e.clientY;return;}
  tYaw+=(e.clientX-lx)*.008;tPitch=clamp(tPitch+(e.clientY-ly)*.004,-.15,.5);lx=e.clientX;ly=e.clientY;idle=0});
cv.addEventListener('wheel',e=>{e.preventDefault();if(opened)dist=clamp(dist+e.deltaY*.01,5,9.2)},{passive:false});
function resize(){const w=innerWidth,h=innerHeight,as=w/h;renderer.setSize(w,h,false);camera.aspect=as;camera.fov=as<.8?56:44;camera.updateProjectionMatrix();
  const tV=Math.tan(camera.fov*Math.PI/360),tH=tV*as,nn=as<.8?.62:1;
  fitS=Math.min(1,tV*8.4/3.9,tH*8.4/(4.4*nn));
  if(nn!==narrow){narrow=nn;if(bouquet)build(seed);}}
addEventListener('resize',resize);resize();
document.getElementById('replay').onclick=()=>{card.hidden=true;tries=0;opened=false;T0=1e9;yaw=tYaw=0;idle=0;};
document.getElementById('fresh').onclick=()=>{seed=Math.floor(Math.random()*1e6);build(seed);if(opened)T0=T;};
cv.style.cursor='default';
build(seed);
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;const t=T-T0;
  idle+=dt;if(!drag&&idle>1.5&&opened)tYaw+=dt*.18;
  yaw+=(tYaw-yaw)*.08;pitch+=(tPitch-pitch)*.08;
  updateDoor(dt);
  bouquet.rotation.y=yaw;
  for(const s of bouquet.userData.stems){const u=s.userData,b=u.base,g=ease((t-b.d)/1.7);
    s.scale.setScalar(Math.max(.001,g));s.rotation.z=b.rz+Math.sin(T*.9+u.ph)*.025;s.rotation.x=Math.cos(T*.7+u.ph)*.02;
    u.pivots.forEach((p,j)=>{const k=ease((t-b.d-1.1-j*.1)/.6);p.pv.scale.setScalar(Math.max(.001,k));p.inner.rotation.z=Math.sin(T*1.6+p.ph+j*.5)*.12;});}
  for(const L of bouquet.userData.leaves){const k=ease((t-L.userData.d)/1.6);L.scale.setScalar(Math.max(.001,k));L.rotation.z=Math.sin(T*.8+L.userData.ph)*.02;}
  for(const h of hearts){h.y+=h.v*dt;const p=h.y/7;if(p>=1){h.y=0;h.x=(hr()*2-1)*3.2;h.z=(hr()*2-1)*2;}
    const on=smooth(3,4.5,t),op=Math.min(1,p*6)*(1-smooth(.62,1,p))*on;
    h.m.opacity=op*.9;h.m.rotation=Math.sin(T+h.ph)*.3;const sc=h.sz*(1-.55*smooth(.7,1,p));h.s.scale.set(sc,sc,1);
    h.s.position.set(Math.cos(yaw)*h.x+Math.sin(yaw)*h.z+Math.sin(T*1.1+h.ph)*.3,h.y,ZOFF-Math.sin(yaw)*h.x+Math.cos(yaw)*h.z);}
  const sp=spg.attributes.position;for(let i=0;i<SP;i++){let y=sp.array[i*3+1]+dt*.12;if(y>7)y=-2;sp.array[i*3+1]=y;sp.array[i*3]+=Math.sin(T*.5+spb[i])*dt*.05;}
  sp.needsUpdate=true;sparks.material.opacity=.45+.3*Math.sin(T*1.7);
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
